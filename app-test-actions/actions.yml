# This is an example of the usage of GitHub Actions to test a NodeJS application and containerize it using Docker. The workflow is triggered on push events to the main branch or any feature branches, as well as manually through workflow dispatch.
# This could be used for an application that is built using NodeJS and needs to be containerized for deployment.
name: Test Application

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs: 
  unit-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: 20
      
      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Results
        uses: actions/upload-artifact@v3
        with:
          name: Mocha-test-result
          path: test-results.xml
          retention-days: 5

  docker:
    name: Containerization app
    needs: [unit-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Dockerhub Login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }} ##Added at the repo level in Github secrets
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Build and testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/app-test-actions:$ {{ github.sha }}
      
      - name: Docker image test
        runn: |
          docker run --name bryan-app -d 
          expose IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' bryan-app)
          echo $IP

          echo Testing Image URL using wget
          wget -q -O - http://$IP:3000 || echo "Failed to connect to the application"

      - name: Docker Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/app-test-actions:$ {{ github.sha }}
